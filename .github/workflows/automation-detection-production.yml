name: Automation Detection (zattas.me)

on:
  schedule:
    - cron: '0 0 * * *'
  deployment_status:

jobs:
  test:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python, java, ruby]
        tool: [selenium, playwright, vibium]
        browser: [chrome]
        exclude:
          # Vibium has no Ruby gem
          - language: ruby
            tool: vibium
          # Vibium Java SDK can't launch Chrome without --no-sandbox, which its Go
          # router doesn't support — no workaround exists without patching the binary
          - language: java
            tool: vibium
        include:
          # JavaScript-only tools
          - language: javascript
            tool: cypress
            browser: chrome

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: ${{ matrix.language }}
          tags: test-image-language-${{ matrix.language }}
          load: true
          no-cache: true

      - name: Run automation detection test
        timeout-minutes: 1
        run: |
          docker run \
            --rm \
            --shm-size=2gb \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            -e TARGET_URL=https://zattas.me \
            -e GALLERY_SCRIPT_DIR=/app/scripts/gallery \
            -e EXPECTED_AUTOMATION_TOOL=${{ matrix.tool }} \
            -e LANGUAGE=${{ matrix.language }} \
            test-image-language-${{ matrix.language }} \
            bash -o pipefail -c '/app/entrypoint.sh 2>&1 | tee /tmp/test-output.log && grep -q "AUTOMATION_DETECTED_VERIFIED" /tmp/test-output.log'
