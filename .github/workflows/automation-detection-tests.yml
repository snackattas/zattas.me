name: Automation Detection Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/components/AutomationFun/**'
      - 'docker/**'
      - '.github/workflows/automation-detection-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/components/AutomationFun/**'
      - 'docker/**'
      - '.github/workflows/automation-detection-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python, java, ruby]
        tool: [selenium, playwright, vibium]
        browser: [chrome]
        exclude:
          # Vibium has no Ruby gem
          - language: ruby
            tool: vibium
        include:
          # JavaScript-only tools
          - language: javascript
            tool: cypress
            browser: chrome

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js source code
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: ${{ matrix.language }}
          tags: test-image-language-${{ matrix.language }}
          load: true
          cache-from: type=gha,scope=${{ matrix.language }}
          cache-to: type=gha,scope=${{ matrix.language }},mode=max

      - name: Start source code server
        run: |
          npm run dev:next > /tmp/dev-server.log 2>&1 &
          # Wait for server to be ready (up to 60 seconds)
          for i in {1..60}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
        env:
          NODE_ENV: test

      - name: Run automation detection test
        timeout-minutes: 1
        run: |
          docker run \
            --rm \
            --shm-size=2gb \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            -e TARGET_URL=http://localhost:3000 \
            -e GALLERY_SCRIPT_DIR=/app/scripts/gallery \
            -e EXPECTED_AUTOMATION_TOOL=${{ matrix.tool }} \
            -e LANGUAGE=${{ matrix.language }} \
            --network host \
            test-image-language-${{ matrix.language }} \
            bash -o pipefail -c '/app/entrypoint.sh 2>&1 | tee /tmp/test-output.log && grep -q "AUTOMATION_DETECTED_VERIFIED" /tmp/test-output.log'

      - name: Show dev server logs on failure
        if: failure()
        run: cat /tmp/dev-server.log
