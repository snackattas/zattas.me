name: Automation Detection Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/components/AutomationFun/**'
      - 'docker/**'
      - '.github/workflows/automation-detection-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/components/AutomationFun/**'
      - 'docker/**'
      - '.github/workflows/automation-detection-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]
        tool: [selenium, playwright]
        browser: [chrome]
        include:
          # Additional combinations to test as we expand coverage
          - language: javascript
            tool: vibium
            browser: chrome

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Build Docker image
        run: docker build -t test-automation-js ./docker/javascript

      - name: Start dev server
        run: |
          npm run dev > /tmp/dev-server.log 2>&1 &
          # Wait for server to be ready
          timeout 30 bash -c 'until curl -f http://localhost:3000 > /dev/null 2>&1; do sleep 1; done'
        env:
          NODE_ENV: test

      - name: Run automation detection test
        run: |
          docker run \
            --rm \
            -e TARGET_URL=http://host.docker.internal:3000 \
            -e EXPECTED_TOOL=${{ matrix.tool }} \
            -e DETECTION_TIMEOUT_MS=10000 \
            -e GALLERY_SCRIPT_PATH=/app/scripts/gallery/selenium.js \
            -v /Users/zacharyattas/code/zattas.me:/app \
            --network host \
            test-automation-js \
            node /app/scripts/tests/assertion-harness/javascript.js

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.language }}-${{ matrix.tool }}-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore

      - name: Show dev server logs on failure
        if: failure()
        run: cat /tmp/dev-server.log

  results:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Test Summary
        run: echo "Automation detection tests completed. Check logs for details."
