name: Automation Detection Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/components/AutomationFun/**'
      - 'docker/**'
      - '.github/workflows/automation-detection-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/components/AutomationFun/**'
      - 'docker/**'
      - '.github/workflows/automation-detection-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python, java]
        tool: [selenium, playwright, vibium]
        browser: [chrome]
        exclude:
          # Cypress only supports JavaScript
          - language: python
            tool: cypress
          - language: java
            tool: cypress
          # Vibium doesn't have a Java Maven package
          - language: java
            tool: vibium
        include:
          # JavaScript-only tools
          - language: javascript
            tool: cypress
            browser: chrome

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Build Docker image
        run: docker build -t test-automation-${{ matrix.language }} -f ./docker/${{ matrix.language }}/Dockerfile .

      - name: Start dev server
        run: |
          npm run dev:next > /tmp/dev-server.log 2>&1 &
          # Wait for server to be ready (up to 60 seconds)
          for i in {1..60}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
        env:
          NODE_ENV: test

      - name: Determine script file extension
        id: script-ext
        run: |
          case "${{ matrix.language }}" in
            javascript) echo "ext=js" >> $GITHUB_OUTPUT ;;
            python) echo "ext=py" >> $GITHUB_OUTPUT ;;
            java) echo "ext=java" >> $GITHUB_OUTPUT ;;
          esac

      - name: Run automation detection test
        run: |
          docker run \
            --rm \
            --shm-size=2gb \
            -e TARGET_URL=http://host.docker.internal:3000 \
            -e GALLERY_SCRIPT_PATH=/app/scripts/gallery/${{ matrix.language }}-${{ matrix.tool }}-fun.${{ steps.script-ext.outputs.ext }} \
            -e EXPECTED_TOOL=${{ matrix.tool }} \
            --network host \
            test-automation-${{ matrix.language }} \
            bash -c '/app/entrypoint.sh 2>&1 | tee /tmp/test-output.log && grep -q "AUTOMATION_DETECTED_VERIFIED" /tmp/test-output.log'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.language }}-${{ matrix.tool }}-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore

      - name: Show dev server logs on failure
        if: failure()
        run: cat /tmp/dev-server.log

  results:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Test Summary
        run: echo "Automation detection tests completed. Check logs for details."
